[project]
name = "jules-api-cli"
version = "0.0.14"
description = "Command-line interface for the Jules REST API"
authors = [
    { name = "Krishna Kanth B" }
]
dependencies = [
    "requests",
    "python-dotenv",
    "tabulate",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "argcomplete>=3.0.0",
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
jules-cli = "src.cli:main"
