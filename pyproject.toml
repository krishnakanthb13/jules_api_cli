[project]
name = "jules-api-cli"
version = "0.1.0"
description = "Command-line interface for the Jules REST API"
authors = [
    { name = "Krishna Kanth B", email = "krishnakanthb13@gmail.com" }
]
dependencies = [
    "requests",
    "python-dotenv",
    "tabulate",
]
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
jules-cli = "src.cli:main"
